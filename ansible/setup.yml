---
- name: Configure
  hosts: all
  vars_files:
    - env.yml
  pre_tasks:
    - name: Check if skip_packages.yml exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/skip_packages.yml"
      register: skip_packages_file

    - name: Load skip_packages.yml
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/skip_packages.yml"
      when: skip_packages_file.stat.exists
  roles:
    - discover
    - base
    - git
    - shell
    - github
    - cargo
    - tools
    - dotfiles
    - docker
  post_tasks:
    - name: Ensure bashrc.d directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.bashrc.d"
        state: directory
        mode: "0755"

    - name: Template GH CLI Auth Token
      ansible.builtin.template:
        src: roles/github/templates/gh_auth_token.bashrc.j2
        dest: "{{ ansible_facts['user_dir'] }}/.bashrc.d/9_gh_auth_token.bashrc"
        mode: "0600"

    - name: Display shell change notification
      ansible.builtin.debug:
        msg: "{{ shell_changed_message }}"
      when: shell_changed_message is defined

    - name: Display cargo installation failure warning
      ansible.builtin.debug:
        msg: |
          WARNING: Cargo package installation failed!
          Packages that failed to install: {{ missing_cargo_packages | join(', ') }}
          Error: {{ cargo_install_error }}
          You can retry manually with: cargo install {{ missing_cargo_packages | join(' ') }} --locked
      when: cargo_install_failed | default(false)

    - name: Check GitHub CLI authentication status
      ansible.builtin.command: gh auth token -h github.com
      register: gh_auth_check
      changed_when: false
      failed_when: false

    - name: Display GitHub CLI setup reminder
      ansible.builtin.debug:
        msg: |
          
          ╔════════════════════════════════════════════════════════════╗
          ║              GitHub CLI Authentication Required            ║
          ╚════════════════════════════════════════════════════════════╝
          
          To complete setup, authenticate with GitHub:
          
              gh auth login
          
          This will:
            • Upload your SSH key to GitHub
            • Enable git operations with GitHub
            • Set up GitHub CLI access
          
      when: gh_auth_check.rc != 0
